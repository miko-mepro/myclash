# ===== Clash / mihomo 通用节点模板（VPS 可迁移）=====
# 能力与原订阅配置一致：
#   fake-ip DNS + respect-rules（DNS 查询本身受路由规则判决）、
#   v4/v6 双栈 × Reality/Hysteria2 共四节点、
#   v4 组与 v6 组各自 Reality→Hy2 的 fallback、顶层 select（默认 v6 组）、
#   广告拦截、内网/直连域名与 GEOIP,CN 分流、MATCH 兜底。
#
# 迁移 VPS 时只需要改以下位置，其余任何一行都不用动：
#   proxies 中带 "←" 的行（锚点定义，其余节点用 *锚点名 引用，改一次全同步）
#     server_v4 / server_v6           新的 VPS 地址
#     port_reality / port_hy2         新的入站端口
#     vless_uuid / hy2_password       新的凭据
#     reality_public_key / reality_short_id   新的 Reality 密钥
#     sni_reality / sni_hy2           新的伪装域名
#   geox-url.mmdb                     自托管 geoip 镜像地址
#   rules 开头两条 IP-CIDR / IP-CIDR6  同步成新的 VPS 地址
# VPS 只有 IPv4 时：删掉两个 v6 节点、整个「🔁 v6(Reality 优先)」组，
# 以及「🚀 节点选择」里对它的引用；并把 default-selected 改为 v4 组。
# 节点全是字面 IP 时用不到 proxy-server-nameserver，换域名节点时无需改结构。

mixed-port: 7890
allow-lan: false
bind-address: '*'
mode: rule
log-level: info
ipv6: true
unified-delay: true
tcp-concurrent: true
find-process-mode: strict

profile:
  store-selected: true
  store-fake-ip: true

geox-url:
  # 自托管 geodata 镜像（MetaCubeX/meta-rules-dat@release/geoip.metadb，
  # 由本机 nginx 提供，见 /var/www/secure/<token>/rules/），
  # 避免大陆客户端拉不到 jsdelivr 时 GEOIP,CN 直接失效。
  # 注意：不再自托管 geosite —— 本配置已不用 geosite 做任何判决。
  mmdb: "https://198.51.100.10.2001-db8--10.sslip.io:8443/CHANGE_ME_TOKEN/rules/geoip.metadb"
  # ↑ 自托管 geoip.metadb 的地址（迁移 VPS 时改这里）。域名格式为
  #   <IPv4 原样>.<IPv6 把 ":" 换成 "-">.sslip.io，token 路径由服务端 nginx 决定；
  #   不自托管就整体删掉 geox-url 段，mihomo 会用内置默认地址。

dns:
  # 关掉就退回系统 DNS，必然泄露；必须是 true
  enable: true
  # 节点与直连 CDN 都有 AAAA，关掉会清空 AAAA，v6 直连收益全丢
  ipv6: true
  # 官方文档：不建议与 respect-rules 合用（h3 会绕出额外连接路径）
  prefer-h3: false
  enhanced-mode: fake-ip
  # 198.18.0.0/15 是基准测试保留段：不与局域网、hosts、节点公网 IP 冲突
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  # 关键开关：mihomo 自己发出的 DNS 查询也走 rules 判据
  #   境内 DoH 的连接被判 DIRECT，境外 DoH 的连接被判 MATCH → 🚀 节点选择，
  #   所以境外查询的源 IP 就是落地节点，符合「查询来源=落地地区」。
  # 约束：仅当 proxy-server-nameserver 不为空时才能开启
  respect-rules: true

  # ① 引导解析器：唯一用途是解析「写成域名的 DoH 主机名」。
  #    本配置四类上游全是 IP 字面量，实际不会触发；保留以守「不出明文 53」：
  #    即便触发，也是 IP:853 的 DoT，而不是 UDP 53。
  default-nameserver:
    - tls://223.5.5.5:853
    - tls://1.12.12.12:853

  # ② 节点服务器域名专用：境内 + 直连 + 永不进代理（防「解析节点域名→走代理」回环）
  #    本订阅 4 条节点全是字面 IP，正常走不到这里；换域名节点时靠它兜。
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query
    - https://1.12.12.12/dns-query

  # ③ 默认解析器 = 「最终走 PROXY 的域名」用的：境外 DoH。
  #    连接本身由 respect-rules 判到 🚀 节点选择，因此查询出口 = 落地节点。
  #    （fake-ip 模式下这类域名绝大多数根本不在本地解析，域名原样交给出口，
  #     这条是「需要本地出结果时」的确定性去向，不是兜底猜测。）
  nameserver:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query

  # ④ 与③配对：最终走 DIRECT 的域名用境内 DoH，保证就近 CDN。
  #    机制是「先定路由，再定解析器」：mihomo 先对连接给出 DIRECT/PROXY 判决，
  #    解析阶段 DIRECT 侧走 direct-nameserver、其它走 nameserver。
  #    因此不需要、也不使用「域名在不在 geosite:cn」这种名单判据：
  #    自建服务 / 自定 DOMAIN-SUFFIX / 私网段只要路由判 DIRECT，就一定用境内解析。
  direct-nameserver:
    - https://223.5.5.5/dns-query
    - https://1.12.12.12/dns-query
  # 让下面的 nameserver-policy（只放特例）优先于 direct-nameserver
  direct-nameserver-follow-policy: true

  # ⑤ nameserver-policy 只承担两类「特例」，不放域名大名单（大名单替代不了④）：
  #    ① 内网/保留域 → 系统解析器：公网 DoH 解析不了 nas.lan
  #       若系统 DNS 指向 mihomo 自己的 TUN 监听会成环，此时请换成 dhcp://<网卡>（如 dhcp://en0）
  #    ② 订阅域名 → 境内 DoH：避免境外 DoH 按美国就近返回被墙的 v4
  nameserver-policy:
    "*.lan,+.lan,*.local,+.local,localhost,*.localhost,+.home.arpa": system
    "+.sslip.io":
      - https://223.5.5.5/dns-query
      - https://1.12.12.12/dns-query

  # fake-ip-filter（blacklist）：命中的域名返回真实解析结果，不分配 fake-ip
  fake-ip-filter:
    # 节点订阅域名：要拿真实 IP 去拉订阅；节点本身是字面 IP，不会被 fake-ip
    - "+.sslip.io"
    # 本地域：fake-ip 会直接弄死 NAS / 路由器后台 / mDNS 名字
    - "*.lan"
    - "+.lan"
    - "*.local"
    - "+.local"
    - "localhost"
    - "*.localhost"
    - "localhost.ptlogin2.qq.com"
    # 联网探测（Captive Portal）：必须真实解析，否则系统永远认为「无网络」
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "connectivitycheck.gstatic.com"
    - "captive.apple.com"
    - "*.qualcomm.com"
    # STUN：WebRTC / 游戏语音要真实 IP 才能打洞，fake-ip 直接打不通
    - "stun.*.*"
    - "stun.*.*.*"
    - "+.stun.*.*"
    - "+.stun.*.*.*"
    # 时间同步：NTP 域名落到 fake-ip 会让时间同步失败（HTTPS 证书全炸）
    - "time.*.com"
    - "time.*.gov"
    - "ntp.*.com"
    - "+.pool.ntp.org"
    - "time1.cloud.tencent.com"

proxies:
  # ═══ 变量区：以下带 "←" 的行是唯一需要修改的取值 ═══
  - name: "VPS-Reality-v4"
    type: vless
    server: &server_v4 "198.51.100.10"             # ← VPS IPv4
    port: &port_reality 443                        # ← Reality 端口
    uuid: &vless_uuid "00000000-0000-0000-0000-000000000000"   # ← VLESS UUID
    network: tcp
    udp: true
    tls: true
    flow: xtls-rprx-vision
    servername: &sni_reality "www.microsoft.com"   # ← 伪装 SNI
    client-fingerprint: chrome
    reality-opts:
      public-key: &reality_public_key "CHANGE_ME"  # ← Reality 公钥
      short-id: &reality_short_id "CHANGE_ME"      # ← Reality short-id

  - name: "VPS-Hysteria2-v4"
    type: hysteria2
    server: *server_v4
    port: &port_hy2 8443                           # ← Hysteria2 端口
    password: &hy2_password "CHANGE_ME"            # ← Hysteria2 密码
    sni: &sni_hy2 "www.bing.com"                   # ← 伪装域名
    alpn:
      - h3
    skip-cert-verify: true
    up: &hy2_up "100 Mbps"
    down: &hy2_down "500 Mbps"

  - name: "VPS-v6-Reality"
    type: vless
    server: &server_v6 "2001:db8::10"              # ← VPS IPv6
    port: *port_reality
    uuid: *vless_uuid
    network: tcp
    udp: true
    tls: true
    flow: xtls-rprx-vision
    servername: *sni_reality
    client-fingerprint: chrome
    reality-opts:
      public-key: *reality_public_key
      short-id: *reality_short_id

  - name: "VPS-v6-Hysteria2"
    type: hysteria2
    server: *server_v6
    port: *port_hy2
    password: *hy2_password
    sni: *sni_hy2
    alpn:
      - h3
    skip-cert-verify: true
    up: *hy2_up
    down: *hy2_down

proxy-groups:
  # v4 两条按「Reality → Hy2」固定顺序 fallback：当前这条健康就一直用，
  # 测不通才换下一条，不会像 url-test 那样按延迟来回跳。
  # 面板里手动点某条会写进 store-selected，之后只在它失效时才被换掉。
  - name: "🔁 v4(Reality 优先)"
    type: fallback
    url: https://www.gstatic.com/generate_204
    interval: 180
    proxies: ["VPS-Reality-v4", "VPS-Hysteria2-v4"]

  # v6 两条同型，顺序同为 Reality → Hy2。
  - name: "🔁 v6(Reality 优先)"
    type: fallback
    url: https://www.gstatic.com/generate_204
    interval: 180
    proxies: ["VPS-v6-Reality", "VPS-v6-Hysteria2"]

  # 顶层三选一：v4 组 / v6 组 / DIRECT，规则集里所有代理规则都指向这里。
  # 默认选中 v6 组；若你的线路 v6 不通而 v4 正常，把 default-selected 改成 v4 组。
  # 已有客户端沿用自己 store-selected 的选择，不受默认值影响。
  - name: "🚀 节点选择"
    type: select
    default-selected: "🔁 v6(Reality 优先)"
    proxies: ["🔁 v4(Reality 优先)", "🔁 v6(Reality 优先)", "DIRECT"]

  # 广告域名默认拦截；确认误杀时可整组切到 DIRECT 放行
  - name: "🛑 拦截广告"
    type: select
    proxies: ["REJECT", "DIRECT"]

rules:
  # 节点自身地址直连，避免自己绕回代理（迁移时同步成新的 VPS 地址）
  - IP-CIDR,198.51.100.10/32,DIRECT,no-resolve
  - IP-CIDR6,2001:db8::10/128,DIRECT,no-resolve
  # 自托管订阅与 geoip 镜像域名固定直连
  - DOMAIN-SUFFIX,sslip.io,DIRECT
  # DNS 上游本身必须直连，否则 respect-rules 会让 DNS 查询绕进代理
  - IP-CIDR,223.5.5.5/32,DIRECT,no-resolve
  - IP-CIDR,1.12.12.12/32,DIRECT,no-resolve
  # 内网/保留域：必须判 DIRECT，否则会落到域名 catch-all → 走代理，
  # 而公网 DoH 又解析不了不存在的名字（dns.nameserver-policy 里配的是系统解析器）
  - DOMAIN-SUFFIX,lan,DIRECT
  - DOMAIN-SUFFIX,local,DIRECT
  - DOMAIN-SUFFIX,localhost,DIRECT
  - DOMAIN-SUFFIX,home.arpa,DIRECT
